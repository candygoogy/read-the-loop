# Deploys site/ to GitHub Pages as it is: there is no build step.
# In the repo's Settings → Pages, "Source" must be "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true  # keeps site/.nojekyll
      - id: deployment
        uses: actions/deploy-pages@v5
