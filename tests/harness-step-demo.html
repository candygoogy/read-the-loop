<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness step: demo</title>
<link rel="stylesheet" href="../site/style.css">
<link rel="stylesheet" href="../site/harness-step.css">
<style>
  /* demo chrome only */
  .demo-head { margin: 0 0 1.25rem; }
  .demo-head h2 { font: 650 1.6rem/1.15 var(--display); margin: 0 0 0.4rem; }
  .demo-head p { margin: 0; color: var(--ink-2); }
  .demo-foot { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-top: 1.25rem; font: 500 0.8rem/1.4 var(--mono); color: var(--ink-2); }
  .demo-foot button { font: inherit; min-height: 2.75rem; padding: 0 1rem; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); cursor: pointer; }
</style>
</head>
<body>
<main class="player" id="demo">
  <div class="demo-head">
    <h2>Round 1: you are the harness</h2>
    <p>Demo of <code>HarnessStep</code> with call 1 of the recording.</p>
  </div>
  <div id="hs-mount"></div>
  <div class="demo-foot">
    <span id="done-count">onDone calls: 0</span>
    <button type="button" id="reset">Start over</button>
  </div>
</main>

<script src="../site/data/trace-01.js"></script>
<script src="../site/harness-step.js"></script>
<script src="../site/lib/trace-ui.js"></script>
<script>
  (function () {
    var esc = window.TraceUI.esc;
    var t = window.TRACE.calls[0].output[0];
    var text = t.result.text.replace(/\s+$/, "");
    var lines = text.split("\n").length;
    window.__hsDone = 0;
    window.__hsWidget = HarnessStep.mount(document.getElementById("hs-mount"), {
      request: {
        tool: t.tool,
        summary: t.input.command,
        bodyHtml: esc(t.input.command.split(" && ").join(" &&\n  ")),
        meta: "“" + t.input.description + "”"
      },
      result: {
        bodyHtml: esc(text),
        meta: lines + " line" + (lines === 1 ? "" : "s") + " pasted back"
      },
      onDone: function () {
        window.__hsDone++;
        document.getElementById("done-count").textContent = "onDone calls: " + window.__hsDone;
      }
    });
    document.getElementById("reset").addEventListener("click", function () {
      window.__hsDone = 0;
      document.getElementById("done-count").textContent = "onDone calls: 0";
      window.__hsWidget.reset();
    });
  })();
</script>
</body>
</html>
